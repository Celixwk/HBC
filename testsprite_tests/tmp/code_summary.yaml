version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React 19
  - Vite
  - React Router
  - Express API
routes:
  - path: /login
    file: frontend/src/pages/Login/Login.tsx
    auth_required: false
    description: Inicio de sesión del sistema hotelero.
  - path: /
    file: frontend/src/pages/Dashboard/Dashboard.tsx
    auth_required: true
    description: Panel principal con estadísticas operativas.
  - path: /reservas
    file: frontend/src/pages/Reservations/Reservations.tsx
    auth_required: true
    description: Gestión de reservas y asignación de habitaciones.
  - path: /habitaciones
    file: frontend/src/pages/Spaces/Spaces.tsx
    auth_required: true
    description: Gestión de habitaciones y espacios.
  - path: /huespedes
    file: frontend/src/pages/Guests/Guests.tsx
    auth_required: true
    description: Consulta y administración de huéspedes.
  - path: /cuentas
    file: frontend/src/pages/Accounts/Accounts.tsx
    auth_required: true
    description: Cuentas, pagos, minibar e historial.
  - path: /configuracion
    file: frontend/src/pages/Settings/Settings.tsx
    auth_required: true
    description: Configuración del hotel, seguridad y respaldos.
  - path: /proveedores
    file: frontend/src/pages/Providers/Providers.tsx
    auth_required: true
    description: Administración de proveedores.
  - path: /inventario
    file: frontend/src/pages/Inventory/Inventory.tsx
    auth_required: true
    description: Productos, categorías y movimientos de inventario.
  - path: /gastos
    file: frontend/src/pages/Gastos/Gastos.tsx
    auth_required: true
    description: Gestión de gastos y categorías.
  - path: /reportes
    file: frontend/src/pages/Reportes/Reportes.tsx
    auth_required: true
    description: Reportes financieros y métricas.
features:
  - name: Autenticación
    description: Inicio de sesión y validación de sesión protegida.
    files:
      - frontend/src/context/AuthContext.tsx
      - frontend/src/pages/Login/Login.tsx
    entry_route: /login
    user_interactions:
      - Ingresar usuario y contraseña.
      - Enviar el formulario de inicio de sesión.
      - Acceder a rutas protegidas tras autenticarse.
    api_calls:
      - method: POST
        endpoint: /api/auth/login
      - method: GET
        endpoint: /api/auth/verify
    auth_required: false
  - name: Operación hotelera
    description: Reservas, huéspedes, habitaciones, pagos y cuentas.
    files:
      - frontend/src/pages/Reservations/Reservations.tsx
      - frontend/src/pages/Guests/Guests.tsx
      - frontend/src/pages/Spaces/Spaces.tsx
      - frontend/src/pages/Accounts/Accounts.tsx
    entry_route: /reservas
    user_interactions:
      - Crear y editar una reserva.
      - Registrar huéspedes y firmas.
      - Actualizar el estado de una habitación.
      - Registrar pagos y cargos.
    api_calls:
      - method: GET
        endpoint: /api/reservas
      - method: POST
        endpoint: /api/reservas
      - method: GET
        endpoint: /api/huespedes
      - method: GET
        endpoint: /api/espacios
    auth_required: true
  - name: Administración y reportes
    description: Inventario, proveedores, gastos, configuración y reportes.
    files:
      - frontend/src/pages/Inventory/Inventory.tsx
      - frontend/src/pages/Providers/Providers.tsx
      - frontend/src/pages/Gastos/Gastos.tsx
      - frontend/src/pages/Reportes/Reportes.tsx
    entry_route: /inventario
    user_interactions:
      - Crear productos, proveedores y gastos.
      - Registrar movimientos de inventario.
      - Consultar reportes financieros.
      - Cambiar parámetros de configuración.
    api_calls:
      - method: GET
        endpoint: /api/inventario/productos
      - method: GET
        endpoint: /api/reportes/pnl
      - method: GET
        endpoint: /api/configuracion
    auth_required: true
known_limitations:
  - issue: La restauración de respaldo usa el puerto 5001, mientras que el proxy de desarrollo usa el puerto 5000.
    location: frontend/src/pages/Settings/BackupRestoreSettings.tsx
    impact: La operación de restauración puede fallar si el backend no expone ese puerto.
